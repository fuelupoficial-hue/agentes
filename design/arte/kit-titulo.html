<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#07070a;overflow:hidden}
body{position:relative;font-family:'Barlow Condensed'}
/* fundo: fibra de carbono desenhada por CSS + brilho laranja */
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 70% 40% at 50% 105%,rgba(255,106,0,.65),transparent 70%),
 radial-gradient(ellipse 60% 35% at 50% 18%,rgba(255,150,40,.18),transparent 70%),
 linear-gradient(45deg,#0b0b0f 25%,#111117 25%,#111117 50%,#0b0b0f 50%,#0b0b0f 75%,#111117 75%);
 background-size:auto,auto,14px 14px}
.beam{position:absolute;top:-20%;left:-10%;width:60%;height:140%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:skewX(-14deg)}
svg.titulo{position:absolute;left:0;top:60px;width:1080px;height:620px;overflow:visible}
.tape{position:absolute;left:-60px;right:-60px;height:70px;display:flex;align-items:center;overflow:hidden;
 background:repeating-linear-gradient(-45deg,#ffc400 0 34px,#111 34px 68px);transform:rotate(-3deg);box-shadow:0 8px 30px rgba(0,0,0,.7)}
.tape .in{margin:0 auto;background:#ffc400;color:#111;height:100%;width:100%;display:flex;align-items:center;gap:36px;padding-left:20px;font-weight:900;font-style:italic;font-size:44px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
.tape .in b{font-weight:900}
.t1{top:30px}
.t2{bottom:120px;transform:rotate(-2deg)}
.coin{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb347,#ff6a00 55%,#b83a00);border:6px solid #1a0f08;box-shadow:0 0 0 4px #ff8a1f,0 0 40px rgba(255,120,0,.8),inset 0 -10px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Anton;font-size:84px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.ring{position:absolute;left:150px;top:690px;width:560px;height:560px;border-radius:50%;border:14px solid #ff7a00;box-shadow:0 0 30px #ff7a00,0 0 90px rgba(255,100,0,.7),inset 0 0 40px rgba(255,100,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#150a05 55%,#2a0f00)}
.ring small{font-weight:800;font-style:italic;font-size:48px;color:#fff;letter-spacing:.08em;text-transform:uppercase}
.ring .ate{font-size:64px;color:#ffc933}
.ring .n{font-family:Anton;font-style:normal;font-size:280px;line-height:.9;background:linear-gradient(#fff,#ffe9a8 55%,#ff9d00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #8a3a00) drop-shadow(0 0 20px rgba(255,140,0,.8))}
.ring .n i{font-size:.5em;font-style:normal}
.ring .off{font-family:Anton;font-size:96px;color:#fff;letter-spacing:.06em;line-height:1;text-shadow:0 5px 0 #8a3a00}
</style></head><body>
<div class="bg"></div><div class="beam"></div>
<div class="tape t1"><div class="in"><span>Black Friday »</span><span>Black Friday »</span><span>Black Friday »</span><span>Black Friday »</span></div></div>
<svg class="titulo" viewBox="0 0 1080 620" id="svg">
 <defs>
  <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff"/><stop offset=".30" stop-color="#e3e7ee"/><stop offset=".47" stop-color="#8a919c"/>
   <stop offset=".50" stop-color="#2b2f36"/><stop offset=".53" stop-color="#9aa1ac"/><stop offset=".78" stop-color="#eef1f5"/><stop offset="1" stop-color="#b9bfc9"/>
  </linearGradient>
  <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#fff6c2"/><stop offset=".28" stop-color="#ffd84a"/><stop offset=".48" stop-color="#e29a00"/>
   <stop offset=".51" stop-color="#7a4300"/><stop offset=".56" stop-color="#e9a400"/><stop offset=".8" stop-color="#ffe27a"/><stop offset="1" stop-color="#c67b00"/>
  </linearGradient>
  <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <g transform="skewX(-8) translate(70 0)">
  <!-- BLACK: extrusão (camadas), contorno escuro, face cromada -->
  <g id="black" font-family="Anton" font-size="330" text-anchor="middle" letter-spacing="4">
   <text x="470" y="270" fill="#ff7a00" opacity=".55" filter="url(#brilho)" stroke="#ff7a00" stroke-width="22" stroke-linejoin="round">BLACK</text>
   <g id="ext-b"></g>
   <text x="470" y="270" fill="#0a0a0d" stroke="#0a0a0d" stroke-width="26" stroke-linejoin="round">BLACK</text>
   <text x="470" y="270" fill="url(#cromo)" stroke="#3a3f48" stroke-width="3">BLACK</text>
  </g>
  <g id="friday" font-family="Anton" font-size="330" text-anchor="middle" letter-spacing="4">
   <text x="470" y="540" fill="#ff7a00" opacity=".6" filter="url(#brilho)" stroke="#ff7a00" stroke-width="22" stroke-linejoin="round">FRIDAY</text>
   <g id="ext-f"></g>
   <text x="470" y="540" fill="#0a0a0d" stroke="#0a0a0d" stroke-width="26" stroke-linejoin="round">FRIDAY</text>
   <text x="470" y="540" fill="url(#ouro)" stroke="#8a4b00" stroke-width="3">FRIDAY</text>
  </g>
 </g>
</svg>
<div class="coin" style="left:40px;top:640px">%</div>
<div class="coin" style="right:50px;top:300px;width:120px;height:120px;font-size:66px">%</div>
<div class="ring"><small class="ate">Até</small><div class="n">50<i>%</i></div><div class="off">OFF</div></div>
<div class="tape t2"><div class="in"><span>Black Friday »</span><span>Black Friday »</span><span>Black Friday »</span><span>Black Friday »</span></div></div>
<script>
// extrusão 3D: cópias deslocadas em tom escuro-alaranjado
function ext(id,txt,y,col){const g=document.getElementById(id);for(let i=26;i>=1;i--){const t=document.createElementNS('http://www.w3.org/2000/svg','text');
 t.setAttribute('x',470+i*.55);t.setAttribute('y',y+i);t.setAttribute('fill',col);t.setAttribute('stroke',col);t.setAttribute('stroke-width','24');t.setAttribute('stroke-linejoin','round');t.textContent=txt;g.appendChild(t)}}
ext('ext-b','BLACK',270,'#1a1d24');ext('ext-f','FRIDAY',540,'#6b3500');
</script></body></html>
