<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1350px}
*{margin:0;padding:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);background:#0a0610;font-family:'Inter',sans-serif;color:#fff;overflow:hidden;position:relative}
body.story{--h:1920px;height:1920px}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#0a0610 0%,#2a0a3d 38%,#a3195b 62%,#ff5a36 82%,#ffb347 100%)}
.sun{position:absolute;left:50%;top:44%;width:760px;height:760px;margin-left:-380px;border-radius:50%;
 background:linear-gradient(180deg,#ffd36b 0%,#ff7a3d 45%,#e8246f 100%);
 -webkit-mask:repeating-linear-gradient(180deg,#000 0 52px,transparent 52px 64px);mask:repeating-linear-gradient(180deg,#000 0 52px,transparent 52px 64px);
 -webkit-mask-composite:source-over;opacity:.95}
.sun::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0a0610 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:30%;background:#0a0610;
 background-image:linear-gradient(#ff3d8b66 2px,transparent 2px),linear-gradient(90deg,#ff3d8b55 2px,transparent 2px);background-size:90px 46px}
.ground{transform-origin:top;box-shadow:0 -2px 30px #ff3d8b}
.top{position:absolute;top:64px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Anton';font-size:46px;letter-spacing:.06em;text-transform:uppercase}
.brand b{color:#ffb347;font-weight:400}
.tag{border:2px solid #fff;padding:10px 22px;font-weight:800;font-size:22px;letter-spacing:.18em;text-transform:uppercase}
.hero{position:absolute;left:64px;right:64px;top:210px}
.bf{font-family:'Anton';font-size:250px;line-height:.9;text-transform:uppercase;letter-spacing:.01em;
 text-shadow:6px 6px 0 #e8246f}
.bf span{display:block;color:#ffd36b;text-shadow:6px 6px 0 #a3195b}
.offer{position:absolute;left:64px;right:64px;bottom:262px}
.upto{margin-bottom:26px;font-weight:800;font-size:34px;letter-spacing:.2em;text-transform:uppercase;color:#ffd36b}
.big{display:flex;align-items:flex-end;gap:22px;margin-top:6px}
.pct{font-family:'Anton';font-size:310px;line-height:.85}
.pct small{font-size:150px}
.desc{font-weight:800;font-size:52px;line-height:1.05;text-transform:uppercase;padding-bottom:30px}
.cta{position:absolute;left:64px;right:64px;bottom:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.btn{background:#fff;color:#0a0610;font-weight:800;font-size:34px;white-space:nowrap;padding:34px 40px;text-transform:uppercase;letter-spacing:.04em;border-radius:6px}
.fine{font-weight:500;font-size:20px;line-height:1.3;opacity:.85;max-width:330px}
body.story .hero{top:330px}
body.story .offer{bottom:420px}body.story .cta{bottom:200px}
</style></head>
<body class="">
<div class="sky"></div><div class="sun"></div><div class="ground"></div>
<div class="top"><div class="brand">Stahl <b>Car</b></div></div>
<div class="hero"><div class="bf">Black<span>Friday</span></div></div>
<div class="offer">
 <div class="upto">Descontos de até</div>
 <div class="big"><div class="pct">50<small>%</small></div><div class="desc">de desconto<br>em serviços*</div></div>
</div>
<div class="cta"><div class="btn">Solicite seu orçamento</div><div class="fine">*Desconto de até 50%, conforme o serviço. Consulte condições com a Stahl Car.</div></div>
<script>if(location.hash==='#story')document.body.classList.add('story')</script>
</body></html>
